name: AVM tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  avm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config gcc-avr binutils-avr avr-libc \
            libasound2-dev libpulse-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev
      - name: Install Python validation dependencies
        run: |
          python3 -m venv build/python
          build/python/bin/python - <<'PYTHON'
          import subprocess
          import sys
          import tomllib
          with open("pyproject.toml", "rb") as source:
              requirements = tomllib.load(source)["project"]["optional-dependencies"]["test"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PYTHON
      - name: Configure AVM
        run: >-
          cmake --preset dev -G Ninja
          -DPython3_EXECUTABLE=${{ github.workspace }}/build/python/bin/python
          -DAVM_MATH_PYTHON_EXECUTABLE=${{ github.workspace }}/build/python/bin/python
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build validation prerequisites
        run: cmake --build build --config RelWithDebInfo --parallel 2 --target avm_validation_build
      - name: Run complete AVM validation
        run: ctest --test-dir build -C RelWithDebInfo -L '^full$' --output-on-failure --output-junit build/validation/results.xml
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avm-validation
          path: |
            build/validation/results.xml
            build/Testing/Temporary/LastTest.log
