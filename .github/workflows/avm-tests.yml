name: AVM tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  avm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config gcc-avr binutils-avr avr-libc \
            libasound2-dev libpulse-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev

      - name: Configure AVM
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # The lit invocations below select AVM tests only. Build their tools
      # explicitly so the full LLVM, Clang, and LLD test suites stay out of CI.
      - name: Build AVM toolchain and lit dependencies
        run: >-
          cmake --build build/ci --parallel 2 --target
          avm_toolchain FileCheck not split-file
          llc llvm-as llvm-dis llvm-mca opt yaml2obj

      - name: Run avm_tests
        id: avm
        continue-on-error: true
        run: cmake --build build/ci --parallel 2 --target avm_tests_run

      - name: LLVM AVM tests
        id: llvm
        continue-on-error: true
        run: build/ci/llvm-build/bin/llvm-lit -sv --filter=AVM build/ci/llvm-build/test

      - name: Clang AVM tests
        id: clang
        continue-on-error: true
        run: build/ci/llvm-build/bin/llvm-lit -sv --filter=AVM build/ci/llvm-build/tools/clang/test

      - name: LLD AVM tests
        id: lld
        continue-on-error: true
        run: build/ci/llvm-build/bin/llvm-lit -sv --filter=AVM build/ci/llvm-build/tools/lld/test

      - name: Check suite results
        if: always()
        env:
          AVM_RESULT: ${{ steps.avm.outcome }}
          LLVM_RESULT: ${{ steps.llvm.outcome }}
          CLANG_RESULT: ${{ steps.clang.outcome }}
          LLD_RESULT: ${{ steps.lld.outcome }}
        run: |
          test "$AVM_RESULT" = success
          test "$LLVM_RESULT" = success
          test "$CLANG_RESULT" = success
          test "$LLD_RESULT" = success
