[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avm-tools"
version = "0.1.0"
requires-python = ">=3.10"
description = "AVM music and development tools"
dependencies = []

[project.optional-dependencies]
midi = ["mido>=1.3,<2"]
audio = ["numpy>=1.26,<3", "scipy>=1.11,<2"]
research = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8", "soundfile>=0.12", "numba>=0.59", "mpmath>=1.3"]
test = ["pytest>=8", "numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8", "mpmath>=1.3", "mido>=1.3,<2", "soundfile>=0.12"]

[tool.setuptools]
package-dir = {"" = "tools"}
packages = ["avm_audio"]
py-modules = ["avm_music", "midi_to_avms", "midi_to_avms_stage2", "avm_audio_features", "avm_audio_optimize", "avm_audio_render"]

[tool.pytest.ini_options]
testpaths = ["tests/tools", "tests/audio"]
cache_dir = "build/pytest-cache"
